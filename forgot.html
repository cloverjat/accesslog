<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password · AccessLog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">AL</div>
        <div>
          <h1>AccessLog</h1>
          <p>Reset access</p>
        </div>
      </div>
      <h2>Forgot password</h2>
      <p class="lede">Enter your email. In production this sends a reset link. Here we show the link so you can test the flow.</p>
      <div id="alert" class="alert"></div>
      <form id="form">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="you@company.com" />
        <button class="btn" type="submit" id="submit">Send reset link</button>
      </form>
      <div id="linkbox" class="demo-note" style="display:none"></div>
      <p class="foot"><a href="index.html">Back to sign in</a></p>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alert = document.getElementById("alert");
      const email = document.getElementById("email").value.trim().toLowerCase();
      await ensureSeed();
      const users = loadUsers();
      const user = users.find(u => u.email === email);
      const geo = await lookupGeo();
      addLog({
        email, name: user ? user.name : "Unknown", success: !!user,
        action: "forgot_password",
        ip: geo.ip, city: geo.city, region: geo.region, country: geo.country,
        isp: geo.isp, userAgent: navigator.userAgent
      });
      if (!user) {
        showAlert(alert, "ok", "If that email exists, a reset link was created.");
        return;
      }
      const token = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
      const resets = loadResets();
      resets[token] = { email, exp: Date.now() + 30 * 60 * 1000 };
      saveResets(resets);
      showAlert(alert, "ok", "Reset token created (demo). Use the link below.");
      const box = document.getElementById("linkbox");
      const href = "reset.html?token=" + encodeURIComponent(token);
      box.style.display = "block";
      box.innerHTML = "Demo reset link (would be emailed):<br><a href=\"" + href + "\">" + href + "</a><br>Expires in 30 minutes.";
    });
  </script>
</body>
</html>
